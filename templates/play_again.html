<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wrong guess</title>
    <style>
        @font-face {
        font-family: 'PokemonFont';
        src: url("{{ url_for('static', filename='pokemon.ttf') }}");
         }
        body {
            background-image: url("{{ url_for('static', filename='background.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        img{
            width: 500px;
            height: auto;
        }
        h1{
            color:#FFDE00;
            font-family: 'PokemonFont','Bangers';
            -webkit-text-stroke:1.5px  #3B4CCA;
            font-size: 40px;
        }
        a{
            text-decoration: none;
            font-size: 25px;
            background-color: #3B4CCA;
            color: #FFDE00;
            padding: 10px 15px;
            font-family:'PokemonFont','Bangers';
            border: 4px solid #CC0000;
            border-radius: 12px;
        }
        a:hover{
            background-color: #2a3990;
            color: #FFDE00;
        }
    </style>
</head>
<body>
    <h1>Wrong! It was {{ pokemon.name }}.</h1>

    <img src="{{ pokemon.sprite }}" alt="{{ pokemon.name }}" width="200">

    <p><a href="{{ url_for('level_1') }}">Play again</a></p>
    <p><a href="{{ url_for('home_page') }}">Home</a></p>
    <audio src="{{ url_for('static', filename='pokemon.mp3') }}" autoplay loop></audio>
</body>
</html>
