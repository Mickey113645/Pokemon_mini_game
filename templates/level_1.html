<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Who's that Pokémon?</title>
    <link href="https://fonts.google.com/specimen/Bangers?preview.script=Latn" rel="stylesheet">

    <style>
         @font-face {
        font-family: 'PokemonFont';
        src: url("{{ url_for('static', filename='pokemon.ttf') }}");
         }
        body {
            background-image: url("{{ url_for('static', filename='background.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 40px;
            align-items: center;    
        }

        img{
            width: 500px;
            height: auto;
            filter: brightness(0);
        }

        .sprite{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        button{
            font-size: 25px;
            background-color: #3B4CCA;
            color: #FFDE00;
            font-family: 'PokemonFont','Bangers';
            border: 4px solid #CC0000;
            border-radius: 12px;
        }
        input{
            font-size: 25px;
            background-color: #3B4CCA;
            color: #FFDE00;
            border: 4px solid #CC0000;
            border-radius: 12px;
        }

        input::placeholder{
            color: #FFDE00;
        }

        button:hover{
            background-color: #2a3990;
            color: #FFDE00;
        }

        h1{
            color:#FFDE00;
            font-family: 'PokemonFont','Bangers';
            -webkit-text-stroke:1.5px  #3B4CCA;
            font-size: 40px;
        }

    </style>
</head>
<body>
    <h1>Who's that Pokémon?</h1>
    <div class="sprite">
        <img src="{{ sprite_imag }}" alt="Pokémon sprite">
    </div>

    <form method="post">
        <input type="text" name="guess" placeholder="Enter Your Guess!!" autofocus>
        <button type="submit">Guess</button>
    </form>
    <audio src="{{ url_for('static', filename='pokemon.mp3') }}" autoplay loop></audio>
</body>
</html>
