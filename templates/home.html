<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Mini Game</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        @font-face {
        font-family: 'PokemonFont';
        src: url("{{ url_for('static', filename='pokemon.ttf') }}");
    }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url("{{ url_for('static', filename='Whos_that_pokemon.webp') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .menu {
            text-align: center;
        }

        .start-button {
            display: inline-block;
            margin:550px 20px 20px 20px;
            padding: 12px 36px;
            font-family: 'PokemonFont','Press start 2P',sans-serif;
            font-size: 1.5rem;
            color: #FFDE00;
            background-color: #3B4CCA;
            border: 4px solid #CC0000;
            border-radius: 12px;
            box-shadow: 0px 6px 0px #000;
            text-decoration: none;
            transition: transform 0.1s;
        }

        .start-button:hover {
            background-color: #2a3990;
            transform: scale(1.05);
        }

        .start-button:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #000;
        }
    </style>
</head>
<body>

    <div class="menu">
        <a href="{{ url_for('level_1') }}" class="start-button">START GAME</a>
    </div>

</body>
</html>
