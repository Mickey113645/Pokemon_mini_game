<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>You win!</title>
    <style>
        @font-face {
        font-family: 'PokemonFont';
        src: url("{{ url_for('static', filename='pokemon.ttf') }}");
        }
        body {
            background-image: url("{{ url_for('static', filename='background.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        a{
            text-decoration: none;
            font-size: 25px;
            background-color: #3B4CCA;
            color: #FFDE00;
            padding: 10px 15px;
            font-family:'PokemonFont','Bangers';
            border: 4px solid #CC0000;
            border-radius: 12px;
        }
        a:hover{
            background-color: #2a3990;
            color: #FFDE00;
        }
        h1{
            color:#FFDE00;
            font-family: 'PokemonFont','Bangers';
            -webkit-text-stroke:3px  #3B4CCA;
            font-size: 100px;
        }
        p{
            color:#FFDE00;
            font-family: 'PokemonFont','Bangers';
            -webkit-text-stroke:1.5px  #3B4CCA;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <h1>You win!</h1>
    <p>{{ stat_label }}: {{ pokemon1.name }} {{ pokemon1[stat] }} vs {{ pokemon2.name }} {{ pokemon2[stat] }}</p>
    <a href="{{ url_for('level_1') }}">Play again</a>
    <audio src="{{ url_for('static', filename='pokemon.mp3') }}" autoplay loop></audio>
</body>
</html>
